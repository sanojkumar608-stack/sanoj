function slabTax(income, brackets) {
    let tax = 0;
    let prev = 0;
    for (const [limit, rate] of brackets) {
        if (income > prev) {
            const chunk = Math.min(income, limit) - prev;
            tax += chunk * rate;
            prev = limit;

            break;
    }
    return tax;

        const limitPct = (isMetro ? 0.5 : 0.4) * basicSalary;

    let hpIncome = 0;

        hpIncome = regime === "old" ? -Math.min(homeLoanInterest, 200000) : 0;
    }
    else {
        const nav = Math.max(0, annualValueLetOut - municipalTaxes);
        hpIncome = nav - nav * 0.3 - homeLoanInterest;
    }
    // Sec 44AD / 44ADA presumptive, or regular books
    let businessIncome = 0;
    if (itrType === "ITR34") {
        if (businessType === "presumptive44AD") {
            businessIncome = turnoverOrReceipts * (digitalReceipts ? 0.06 : 0.08);
        }
        else if (businessType === "presumptive44ADA") {
            businessIncome = turnoverOrReceipts * 0.5;
        }
        else {
            businessIncome = netProfitRegular;
        }
    }
    const otherSourcesIncome = interestIncome + dividendIncome + otherIncome;
    const normalIncome = netSalary + hpIncome + businessIncome + otherSourcesIncome;
    // Sec 111A / 112A capital gains
    const ltcgTaxable = Math.max(0, ltcgEquity - 125000);
    const capGainsTax = ltcgTaxable * 0.125 + stcgEquity * 0.2;
    // Chapter VI-A — auto-capped per current section limits
    const cap80C = Math.min(deduction80C, 150000);
    const cap80CCD1B = Math.min(deduction80CCD1B, 50000);

            if (slab > excess)

        slab, rebate, slabAfterRebate, surcharge, cess, totalTaxLiability,
